<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f8f9fa;color:#222;line-height:1.7}
.container{max-width:960px;margin:0 auto;padding:20px}

/* --- Top Bar: Search + Language --- */
.top-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:30px;flex-wrap:wrap}
.search-box{flex:1;min-width:200px;display:flex;gap:6px}
.search-box input{flex:1;padding:8px 14px;border:2px solid #ddd;border-radius:6px;font-size:14px;outline:none}
.search-box input:focus{border-color:#222}
.search-box button{padding:8px 16px;background:#222;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px}
.search-box button:hover{background:#444}

.lang-nav{display:flex;flex-wrap:wrap;gap:4px}
.lang-nav a{display:inline-block;padding:4px 10px;border-radius:4px;font-size:13px;text-decoration:none;color:#555;border:1px solid #ddd;transition:all 0.2s}
.lang-nav a:hover{background:#eee}
.lang-nav a.active{background:#222;color:#fff;border-color:#222;font-weight:600}

/* --- Brand Header --- */
.brand-header{margin-bottom:30px;padding-bottom:20px;border-bottom:2px solid #222}
.brand-header h1{font-size:32px;margin-bottom:4px;letter-spacing:-0.5px}
.brand-header .brand-sub{font-size:16px;color:#777}


/* --- Brand Info Cards --- */
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-bottom:30px}
.info-card{background:#fff;border:1px solid #eee;border-radius:8px;padding:14px 18px}
.info-card .label{font-size:12px;color:#999;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px}
.info-card .value{font-size:15px;color:#222;font-weight:500}

/* --- Content Body --- */
.brand-content{background:#fff;border:1px solid #eee;border-radius:8px;padding:24px;margin-bottom:30px;font-size:15px;line-height:1.8}
.brand-content h2{font-size:20px;margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid #eee}
.brand-content h2:first-child{margin-top:0}
.brand-content p{margin-bottom:12px}

/* --- Product / Event lists --- */
.item-list{list-style:none;margin:8px 0 16px}
.item-list li{padding:6px 0;border-bottom:1px solid #f5f5f5}
.item-list li:last-child{border:none}
.item-list .item-year{display:inline-block;background:#222;color:#fff;padding:1px 8px;border-radius:3px;font-size:12px;margin-right:8px;font-weight:600}

/* --- Similar Brands --- */
.similar-section{margin-bottom:30px}
.similar-section h3{font-size:16px;margin-bottom:12px;color:#555}
.similar-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.similar-card{display:block;padding:10px 14px;background:#fff;border:1px solid #eee;border-radius:6px;text-decoration:none;color:#222;font-size:13px;transition:all 0.2s}
.similar-card:hover{border-color:#222;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.similar-card.premium{border:2px solid #d4a844}
.similar-card.premium .badge-premium{display:inline-block;background:#d4a844;color:#fff;font-size:10px;padding:1px 6px;border-radius:3px;margin-left:4px}
.similar-card .zh{display:block;font-weight:500}
.similar-card .en{display:block;font-size:11px;color:#999}

/* --- 预留坑位 (广告位) --- */
.similar-card.slot-open{border:2px dashed #d4a844;background:#fefcf5;cursor:default}
.similar-card.slot-open:hover{border-color:#b8922e;box-shadow:0 2px 12px rgba(212,168,68,0.15)}
.similar-card.slot-open .badge-slot{display:inline-block;background:#d4a844;color:#fff;font-size:10px;padding:1px 6px;border-radius:3px;margin-left:4px}
.similar-card.slot-open .zh{color:#d4a844;font-style:italic}
.similar-card.slot-open .en{color:#c9a94e}

/* --- Footer --- */
.footer{text-align:center;padding:20px 0;font-size:13px;color:#999;border-top:1px solid #eee;margin-top:10px}
.footer a{color:#555;text-decoration:none}
.footer a:hover{text-decoration:underline}

/* --- Premium Styles --- */
.premium-header{border-bottom-color:#d4a844}
.premium-card{border:2px solid #d4a844 !important}
.premium-label{display:inline-block;background:#d4a844;color:#fff;font-size:11px;padding:2px 10px;border-radius:4px;margin-left:8px}

/* --- Responsive --- */
@media(max-width:600px){
  .top-bar{flex-direction:column;align-items:stretch}
  .info-grid{grid-template-columns:1fr}
  .similar-grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
}
</style>
</head>
<body>
<div class="container">

<!-- Top Bar -->
<div class="top-bar">
  <div class="search-box">
    <input type="text" id="search-input" placeholder="搜索品牌 / Search brand..." onkeydown="if(event.key==='Enter')searchBrand()">
    <button onclick="searchBrand()">🔍</button>
  </div>
  <div class="lang-nav" id="lang-nav">
    <a href="#" data-lang="zh-CN" class="active" onclick="switchLang('zh-CN')">中文</a>
    <a href="#" data-lang="en" onclick="switchLang('en')">EN</a>
    <a href="#" data-lang="fr" onclick="switchLang('fr')">FR</a>
    <a href="#" data-lang="es" onclick="switchLang('es')">ES</a>
    <a href="#" data-lang="de" onclick="switchLang('de')">DE</a>
    <a href="#" data-lang="ja" onclick="switchLang('ja')">日本語</a>
    <a href="#" data-lang="ko" onclick="switchLang('ko')">한국어</a>
    <a href="#" data-lang="pt" onclick="switchLang('pt')">PT</a>
    <a href="#" data-lang="ru" onclick="switchLang('ru')">РУ</a>
    <a href="#" data-lang="ar" onclick="switchLang('ar')">العربية</a>
  </div>
</div>

<!-- Brand Header -->
<div class="brand-header">
  <h1 id="brand-title">Denka <span style="font-weight:400;font-size:24px;color:#777">— Denka</span></h1>
  <div class="brand-sub" id="brand-sub">综合</div>
</div>

<!-- Info Cards -->
<div class="info-grid" id="info-grid">
  <div class="info-card"><div class="label">创立时间 · Founded</div><div class="value" id="val-year"></div></div>
  <div class="info-card"><div class="label">创立地点 · Location</div><div class="value" id="val-location"></div></div>
  <div class="info-card"><div class="label">创始人 · Founder</div><div class="value" id="val-founder"></div></div>
  <div class="info-card"><div class="label">官网 · Website</div><div class="value" id="val-website"></div></div>
  <div class="info-card"><div class="label">主营业务 · Business</div><div class="value" id="val-business"></div></div>
  <div class="info-card"><div class="label">品牌标语 · Slogan</div><div class="value" id="val-slogan"></div></div>
</div>

<!-- Content -->
<div class="brand-content" id="brand-content">
  <p id="content-text"></p>
</div>

<!-- Similar Brands -->
<div class="similar-section">
  <h3 id="similar-title">类似品牌</h3>
  <div class="similar-grid" id="similar-grid">
    <a href="/escher/" class="similar-card premium"><span class="zh">埃舍尔Escher <span class="badge-premium">品牌推广</span></span><span class="en">埃舍尔Escher</span></a>
    <div id="dynamic-similars" style="display:contents"></div>
  </div>
</div>

<!-- Footer -->
<div class="footer">
  <p><a href="https://pinpai.cc.cd">全球品牌索引 · pinpai.cc.cd</a> — 全球品牌大全，10种语言呈现</p>
</div>

<!-- 首页按钮 -->
<div style="text-align:center;margin:30px 0 40px">
  <a href="/" style="display:inline-block;padding:14px 48px;background:#e53935;color:#fff;font-size:18px;font-weight:bold;border-radius:8px;text-decoration:none;box-shadow:0 4px 12px rgba(229,57,53,0.4);transition:all 0.2s;" onmouseover="this.style.background='#c62828';this.style.boxShadow='0 6px 16px rgba(229,57,53,0.6)'" onmouseout="this.style.background='#e53935';this.style.boxShadow='0 4px 12px rgba(229,57,53,0.4)'">🏠 首页</a>
</div>

</div><!-- /container -->

<script>
// ===== Load brand data from brand.json =====
var brandData = null;
var brandsIndex = [];

function loadBrandData() {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', 'brand.json', true);
  xhr.onload = function() {
    if (xhr.status === 200) {
      brandData = JSON.parse(xhr.responseText);
      applyData('zh-CN');
    }
  };
  xhr.send();
  // Also load brands index for similar section
  var xhr2 = new XMLHttpRequest();
  xhr2.open('GET', '/brands_index.json', true);
  xhr2.onload = function() {
    if (xhr2.status === 200) {
      brandsIndex = JSON.parse(xhr2.responseText);
      renderSimilarBrands();
    }
  };
  xhr2.send();
}

function getLangData(lang) {
  if (!brandData) return null;

  var name = brandData.name_zh || (brandData.names && brandData.names['zh-CN']) || brandData.name_en || '';
  var name_en = brandData.name_en || (brandData.names && brandData.names['en']) || '';
  var founding_year = brandData.founding_year || brandData.year || '';
  var founding_location = brandData.founding_location || brandData.country || '';
  var founder = brandData.founder || '';
  var website = brandData.official_website || brandData.website || '';
  var business = (brandData.main_business || []).join(', ') || brandData.category || '';
  var slogan = brandData.current_slogan || brandData.slogan || '';

  // Build content from available data
  var content = '';
  var zhContent = brandData.description_zh || (brandData.languages && brandData.languages['zh-CN']) || '';

  if (lang === 'zh-CN') {
    if (zhContent) {
      content = '<p>' + zhContent.replace(/\n/g, '</p><p>') + '</p>';
    } else {
      // Build from available structured data
      var parts = [];
      parts.push(name + '（' + name_en + '）是全球知名品牌' + (founding_year ? '，创立于' + founding_year + '年' : '') + '。' + (founder ? '由' + founder + '创立。' : ''));
      if (founding_location) parts.push('总部位于' + founding_location + '。');
      if (business) parts.push('主营业务包括' + business + '。');
      if (brandData.historical_facts && brandData.historical_facts.length > 0) {
        parts.push('</p><h2>发展历程</h2><p>');
        for (var k = 0; k < brandData.historical_facts.length; k++) {
          parts.push(brandData.historical_facts[k] + '。');
        }
      }
      content = '<p>' + parts.join(' ') + '</p>';
    }
  } else {
    var langContent = brandData.languages && brandData.languages[lang];
    if (langContent) {
      content = '<p>' + langContent.replace(/\n/g, '</p><p>') + '</p>';
    } else {
      content = '<p>' + name_en + ' is a global brand.' + (founding_year ? ' Founded in ' + founding_year + '.' : '') + (founder ? ' Founded by ' + founder + '.' : '') + '</p>';
    }
  }

  return {
    name: lang === 'zh-CN' ? name : name_en,
    name_en: name_en,
    founding_year: founding_year,
    founding_location: founding_location,
    founder: founder,
    website: website,
    business: business,
    slogan: slogan,
    content: content,
    similar_title: '类似品牌'
  };
}

function applyData(lang) {
  var data = getLangData(lang);
  if (!data) return;

  document.getElementById('brand-title').innerHTML = data.name + (data.name_en ? ' <span style="font-weight:400;font-size:24px;color:#777">— ' + data.name_en + '</span>' : '');
  
  // Only show info cards that have data
  var cardMappings = [
    {id: 'val-year', label: '创立时间 · Founded', val: data.founding_year},
    {id: 'val-location', label: '创立地点 · Location', val: data.founding_location},
    {id: 'val-founder', label: '创始人 · Founder', val: data.founder},
    {id: 'val-website', label: '官网 · Website', val: data.website},
    {id: 'val-business', label: '主营业务 · Business', val: data.business},
    {id: 'val-slogan', label: '品牌标语 · Slogan', val: data.slogan},
  ];
  
  // Hide all info card wrappers first, then show only those with data
  var allCards = document.getElementById('info-grid').children;
  for (var i = 0; i < allCards.length; i++) {
    allCards[i].style.display = 'none';
  }
  
  for (var m = 0; m < cardMappings.length; m++) {
    var cm = cardMappings[m];
    var el = document.getElementById(cm.id);
    if (el && cm.val) {
      el.textContent = el.tagName === 'DIV' ? cm.val : (cm.val);
      // Find the parent info-card div and show it
      var parent = el.closest('.info-card');
      if (parent) parent.style.display = '';
    }
  }

  document.getElementById('content-text').innerHTML = data.content || '';
}

function switchLang(lang) {
  document.querySelectorAll('.lang-nav a').forEach(function(a) {
    a.classList.toggle('active', a.getAttribute('data-lang') === lang);
  });
  document.documentElement.setAttribute('lang', lang === 'ar' ? 'ar' : 'zh-CN');
  document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
  applyData(lang);
}

function searchBrand() {
  var q = document.getElementById('search-input').value.trim();
  if (!q) return;
  window.location.href = '/search.html?q=' + encodeURIComponent(q);
}

function renderSimilarBrands() {
  if (!brandsIndex || brandsIndex.length === 0) return;
  // Get latest brands except current one, max 10
  var currentSlug = window.location.pathname.split('/').filter(Boolean)[0];
  var maxSimilars = 10;
  var count = 0;
  var html = '';
  for (var i = 0; i < brandsIndex.length && count < maxSimilars; i++) {
    var b = brandsIndex[i];
    if (b.slug === currentSlug) continue;
    html += '<a href="/' + b.slug + '/" class="similar-card"><span class="zh">' + (b.name || '') + ' </span><span class="en">' + (b.name_en || '') + '</span></a>';
    count++;
  }
  var container = document.getElementById('dynamic-similars');
  if (container) container.innerHTML = html;
}

// Initialize
loadBrandData();
</script>
</body>
</html>
